<!DOCTYPE html>
<html>

<head>
    <title>Forgrinnitoring Test</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4d03f;
            color: #000;
            background-image: radial-gradient(#000 1.5px, transparent 1.5px);
            background-size: 25px 25px;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border: 4px solid #000;
            box-shadow: 12px 12px 0px #000;
        }

        h1 {
            color: #000;
            border-bottom: 4px solid #000;
            padding-bottom: 10px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #ff90e8;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        p {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        button {
            background-color: #a3ff90;
            color: #000;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px #000;
        }

        button:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px #000;
        }

        button.stop {
            background-color: #ff90e8;
        }

        .status {
            padding: 15px;
            margin: 20px 0;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .status.running {
            background-color: #90fcf9;
            color: #000;
        }

        .status.stopped {
            background-color: #ffb86c;
            color: #000;
        }

        .logs {
            background-color: #f4f4f4;
            padding: 15px;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: 700;
        }

        .log-entry {
            padding: 10px;
            margin: 8px 0;
            background-color: #fff;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
        }

        .log-entry.error-log {
            background-color: #ff90e8;
            color: #000;
        }

        .error {
            color: #000;
            background-color: #ff90e8;
            padding: 15px;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            margin: 15px 0;
            font-weight: 800;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎯 Forgrinnitoring Test</h1>
        <p>This page tests the monitoring functionality for Task 4.4</p>

        <div id="status" class="status stopped">
            Status: <span id="statusText">Unknown</span>
        </div>

        <div>
            <button onclick="startMonitoring()">▶️ Start Monitoring</button>
            <button onclick="stopMonitoring()" class="stop">⏹️ Stop Monitoring</button>
            <button onclick="checkStatus()">🔄 Check Status</button>
            <button onclick="getActivityLogs()">📊 Get Activity Logs</button>
        </div>

        <div id="logs" class="logs">
            <div style="color: #000; font-weight: 700;">Logs will appear here...</div>
        </div>
    </div>

    <script>
        // Check if we're running in Tauri
        if (typeof window.__TAURI__ === 'undefined') {
            document.getElementById('logs').innerHTML =
                '<div class="error">⚠️ Not running in Tauri environment. Please open this in the Forgrin desktop app.</div>';
        }

        const { invoke } = window.__TAURI__.tauri;

        function log(message, isError = false) {
            const logsDiv = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            if (isError) {
                entry.classList.add('error-log');
            }
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.insertBefore(entry, logsDiv.firstChild);
        }

        async function startMonitoring() {
            try {
                log('Starting monitoring...');
                const result = await invoke('start_monitoring');
                log(`✅ ${result}`);
                await checkStatus();
            } catch (error) {
                log(`❌ Error: ${error}`, true);
            }
        }

        async function stopMonitoring() {
            try {
                log('Stopping monitoring...');
                const result = await invoke('stop_monitoring');
                log(`✅ ${result}`);
                await checkStatus();
            } catch (error) {
                log(`❌ Error: ${error}`, true);
            }
        }

        async function checkStatus() {
            try {
                const isRunning = await invoke('get_monitoring_status');
                const statusDiv = document.getElementById('status');
                const statusText = document.getElementById('statusText');

                if (isRunning) {
                    statusDiv.className = 'status running';
                    statusText.textContent = 'Monitoring is RUNNING ✅';
                    log('Status: Monitoring is running');
                } else {
                    statusDiv.className = 'status stopped';
                    statusText.textContent = 'Monitoring is STOPPED ⏹️';
                    log('Status: Monitoring is stopped');
                }
            } catch (error) {
                log(`❌ Error checking status: ${error}`, true);
            }
        }

        async function getActivityLogs() {
            try {
                log('Fetching activity logs...');

                // Get logs from the last 5 minutes
                const now = Date.now();
                const fiveMinutesAgo = now - (5 * 60 * 1000);

                const logs = await invoke('get_activity_logs', {
                    startTime: fiveMinutesAgo,
                    endTime: now
                });

                if (logs.length === 0) {
                    log('⚠️ No activity logs found in the last 5 minutes');
                } else {
                    log(`📊 Found ${logs.length} activity log(s):`);
                    logs.forEach((logEntry, index) => {
                        const timestamp = new Date(logEntry.timestamp);
                        log(`  ${index + 1}. ${logEntry.application} (${logEntry.duration}s) at ${timestamp.toLocaleTimeString()}`);
                    });
                }
            } catch (error) {
                log(`❌ Error fetching logs: ${error}`, true);
            }
        }

        // Check status on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(checkStatus, 500);
        });
    </script>
</body>

</html>
