[package]
name = "focusforge-desktop"
version = "0.1.0"
description = "FocusForge Desktop Application - Unified productivity tracking with embedded Next.js frontend"
authors = ["FocusForge Team"]
license = "MIT"
repository = "https://github.com/focusforge/focusforge"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri framework with required features
tauri = { version = "1.5", features = [ "notification-all", "shell-open", "system-tray", "notification", "window-all", "fs-all"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for cloud sync
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# UUID generation for sessions
uuid = { version = "1.0", features = ["v4", "serde"] }

# Password hashing
argon2 = "0.5"

# Notifications
notify-rust = "4.10"

# Directory paths
dirs = "5.0"

# CSV export
csv = "1.3"

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Com"
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
