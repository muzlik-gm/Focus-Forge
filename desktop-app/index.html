<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusForge Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .status {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }
        
        .button {
            background: white;
            color: #667eea;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .info {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 2rem;
            font-size: 0.9rem;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 FocusForge</h1>
        <p>Desktop Application - System Monitoring Ready</p>
        
        <div class="status">
            <h2>Status: <span id="status">Initializing...</span></h2>
            <div id="loading" class="loading" style="margin: 1rem auto;"></div>
        </div>
        
        <div>
            <button class="button" onclick="startMonitoring()">Start Monitoring</button>
            <button class="button" onclick="stopMonitoring()">Stop Monitoring</button>
            <button class="button" onclick="getActiveWindow()">Get Active Window</button>
        </div>
        
        <div class="info">
            <p><strong>Next Steps:</strong></p>
            <p>1. The desktop app is now running</p>
            <p>2. System monitoring will track your applications</p>
            <p>3. Check the system tray for quick actions</p>
            <p>4. The web app will be embedded here soon</p>
        </div>
        
        <div id="output" style="margin-top: 2rem; text-align: left; background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 10px; font-family: monospace; font-size: 0.9rem; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.tauri;
        
        function log(message) {
            const output = document.getElementById('output');
            const time = new Date().toLocaleTimeString();
            output.innerHTML += `[${time}] ${message}<br>`;
            output.scrollTop = output.scrollHeight;
        }
        
        async function startMonitoring() {
            try {
                const result = await invoke('start_monitoring');
                log('✅ ' + result);
                document.getElementById('status').textContent = 'Monitoring Active';
            } catch (error) {
                log('❌ Error: ' + error);
            }
        }
        
        async function stopMonitoring() {
            try {
                const result = await invoke('stop_monitoring');
                log('⏸️ ' + result);
                document.getElementById('status').textContent = 'Monitoring Stopped';
            } catch (error) {
                log('❌ Error: ' + error);
            }
        }
        
        async function getActiveWindow() {
            try {
                const result = await invoke('get_active_window');
                log('🪟 ' + result);
            } catch (error) {
                log('❌ Error: ' + error);
            }
        }
        
        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').textContent = 'Ready';
                log('🚀 FocusForge Desktop initialized');
                log('📊 System monitoring available');
                log('💡 Click buttons above to test functionality');
            }, 1000);
        });
    </script>
</body>
</html>
