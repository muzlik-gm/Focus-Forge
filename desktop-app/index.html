<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgrin Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4d03f;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(#000 1.5px, transparent 1.5px);
            background-size: 25px 25px;
        }

        .container {
            text-align: center;
            max-width: 700px;
            width: 100%;
            background-color: #fff;
            border: 4px solid #000;
            box-shadow: 12px 12px 0px #000;
            padding: 3rem 2rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #000;
            text-shadow: 4px 4px 0px #ff90e8;
            border-bottom: 4px solid #000;
            padding-bottom: 10px;
            display: inline-block;
        }

        p {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 2rem;
            margin-top: 1rem;
            color: #000;
        }

        .status {
            background-color: #a3ff90;
            padding: 1.5rem;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            margin-bottom: 2.5rem;
        }

        .status h2 {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .button {
            background-color: #ff90e8;
            color: #000;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin: 0.5rem;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .button:nth-child(2) {
            background-color: #90fcf9;
        }

        .button:nth-child(3) {
            background-color: #ffb86c;
        }

        .button:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px #000;
        }

        .button:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px #000;
        }

        .info {
            background-color: #fff;
            padding: 1.5rem;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            margin-top: 2rem;
            text-align: left;
        }

        .info p {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0.5rem 0;
            color: #000;
        }

        .loading {
            display: inline-block;
            width: 30px;
            height: 30px;
            background-color: #000;
            margin: 1rem auto;
            border: 4px solid #000;
            animation: spin-brutal 1.5s steps(4) infinite;
        }

        @keyframes spin-brutal {
            0% {
                transform: rotate(0deg);
                background-color: #ff90e8;
            }

            25% {
                transform: rotate(90deg);
                background-color: #90fcf9;
            }

            50% {
                transform: rotate(180deg);
                background-color: #a3ff90;
            }

            75% {
                transform: rotate(270deg);
                background-color: #ffb86c;
            }

            100% {
                transform: rotate(360deg);
                background-color: #ff90e8;
            }
        }

        #output {
            margin-top: 2.5rem;
            text-align: left;
            background-color: #f4f4f4;
            padding: 1rem;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: 700;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎯 Forgrin</h1>
        <p>Desktop Application - System Monitoring Ready</p>

        <div class="status">
            <h2>Status: <span id="status">Initializing...</span></h2>
            <div id="loading" class="loading"></div>
        </div>

        <div>
            <button class="button" onclick="startMonitoring()">Start Monitoring</button>
            <button class="button" onclick="stopMonitoring()">Stop Monitoring</button>
            <button class="button" onclick="getActiveWindow()">Get Active Window</button>
        </div>

        <div class="info">
            <p><strong>Next Steps:</strong></p>
            <p>1. The desktop app is now running</p>
            <p>2. System monitoring will track your applications</p>
            <p>3. Check the system tray for quick actions</p>
            <p>4. The web app will be embedded here soon</p>
        </div>

        <div id="output"></div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.tauri;

        function log(message) {
            const output = document.getElementById('output');
            const time = new Date().toLocaleTimeString();
            output.innerHTML += `[${time}] ${message}<br>`;
            output.scrollTop = output.scrollHeight;
        }

        async function startMonitoring() {
            try {
                const result = await invoke('start_monitoring');
                log('✅ ' + result);
                document.getElementById('status').textContent = 'Monitoring Active';
            } catch (error) {
                log('❌ Error: ' + error);
            }
        }

        async function stopMonitoring() {
            try {
                const result = await invoke('stop_monitoring');
                log('⏸️ ' + result);
                document.getElementById('status').textContent = 'Monitoring Stopped';
            } catch (error) {
                log('❌ Error: ' + error);
            }
        }

        async function getActiveWindow() {
            try {
                const result = await invoke('get_active_window');
                log('🪟 ' + result);
            } catch (error) {
                log('❌ Error: ' + error);
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').textContent = 'Ready';
                log('🚀 Forgrin Desktop initialized');
                log('📊 System monitoring available');
                log('💡 Click buttons above to test functionality');
            }, 1000);
        });
    </script>
</body>

</html>
